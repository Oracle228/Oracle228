<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 620" width="2400" height="620" role="img" aria-label="Lozyk / Hex_a — developer, curious mind">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1c"/>
      <stop offset=".48" stop-color="#0c1630"/>
      <stop offset="1" stop-color="#171634"/>
    </linearGradient>
    <radialGradient id="fogA" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#5c4bdc" stop-opacity=".62"/>
      <stop offset=".55" stop-color="#5c4bdc" stop-opacity=".18"/>
      <stop offset="1" stop-color="#5c4bdc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fogB" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2f7bff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#2f7bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fogC" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#a97bff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#a97bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".45" r=".78">
      <stop offset=".55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".55"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfd3ff"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9d8bff"/>
      <stop offset=".5" stop-color="#5b5ce0"/>
      <stop offset="1" stop-color="#2f6bff"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".42"/>
      <stop offset=".4" stop-color="#c7d3ff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#8f9dff" stop-opacity=".28"/>
    </linearGradient>
    <radialGradient id="orb" cx=".34" cy=".28" r=".78">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".14" stop-color="#cfdbff"/>
      <stop offset=".38" stop-color="#8a9cff"/>
      <stop offset=".66" stop-color="#4c4fae"/>
      <stop offset=".88" stop-color="#221f52"/>
      <stop offset="1" stop-color="#141433"/>
    </radialGradient>
    <linearGradient id="ringA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9c6ff" stop-opacity="0"/>
      <stop offset=".3" stop-color="#b9c6ff" stop-opacity=".55"/>
      <stop offset=".7" stop-color="#8fd8ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8fd8ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f9dff" stop-opacity=".75"/>
      <stop offset=".55" stop-color="#8f9dff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#8f9dff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridFade" cx=".42" cy=".5" r=".72">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask">
      <rect width="2400" height="620" fill="url(#gridFade)"/>
    </mask>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="frame">
      <rect x="4" y="4" width="2392" height="612" rx="34"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="2400" height="620" fill="url(#base)"/>
    <g filter="url(#soft)">
      <ellipse cx="300" cy="40" rx="520" ry="330" fill="url(#fogA)"/>
      <ellipse cx="880" cy="600" rx="520" ry="300" fill="url(#fogB)"/>
      <ellipse cx="1980" cy="520" rx="440" ry="300" fill="url(#fogC)"/>
    </g>
    <rect width="2400" height="620" fill="url(#grid)" mask="url(#gridMask)" opacity=".8"/>

    <!-- horizon light -->
    <ellipse cx="1860" cy="360" rx="520" ry="300" fill="#3b4bd8" opacity=".26" filter="url(#soft)"/>

    <!-- orbit emblem -->
    <g opacity=".95">
      <circle cx="1888" cy="312" r="248" fill="#6d7bff" opacity=".14" filter="url(#soft)"/>
      <circle cx="1888" cy="312" r="152" fill="url(#orb)"/>
      <circle cx="1888" cy="312" r="152" fill="none" stroke="#dfe6ff" stroke-opacity=".5" stroke-width="1.4"/>
      <g transform="rotate(-17 1888 312)">
        <ellipse cx="1888" cy="312" rx="236" ry="66" fill="none" stroke="url(#ringA)" stroke-width="3"/>
        <ellipse cx="1888" cy="312" rx="292" ry="100" fill="none" stroke="url(#ringA)" stroke-width="1.8" opacity=".8"/>
      </g>
      <g transform="rotate(22 1888 312)">
        <ellipse cx="1888" cy="312" rx="200" ry="54" fill="none" stroke="#a9b8ff" stroke-opacity=".22" stroke-width="1.2"/>
      </g>
      <g transform="translate(1888 312)">
        <path d="M0-44C4.4-15.6 15.6-4.4 44 0 15.6 4.4 4.4 15.6 0 44-4.4 15.6-15.6 4.4-44 0-15.6-4.4-4.4-15.6 0-44z" fill="#ffffff" opacity=".28" filter="url(#glow)"/>
        <path d="M0-34C3.4-12 12-3.4 34 0 12 3.4 3.4 12 0 34-3.4 12-12 3.4-34 0-12-3.4-3.4-12 0-34z" fill="#ffffff"/>
      </g>
      <circle cx="1408" cy="150" r="3" fill="#cdd7ff" opacity=".8"/>
      <circle cx="2160" cy="196" r="2.4" fill="#9fb4ff" opacity=".7"/>
      <circle cx="2062" cy="470" r="2.8" fill="#c3b6ff" opacity=".6"/>
      <circle cx="1340" cy="430" r="2" fill="#8fd8ff" opacity=".55"/>
    </g>

    <!-- identity -->
    <g transform="translate(150 132)">
      <rect x="0" y="0" width="116" height="116" rx="32" fill="#0b1024" opacity=".55"/>
      <rect x="0" y="0" width="116" height="116" rx="32" fill="url(#tile)"/>
      <rect x="0.75" y="0.75" width="114.5" height="114.5" rx="31.25" fill="none" stroke="#ffffff" stroke-opacity=".34"/>
      <path d="M58 26c3.5 16.8 11.7 25 28.5 28.5-16.8 3.5-25 11.7-28.5 28.5-3.5-16.8-11.7-25-28.5-28.5C46.3 51 54.5 42.8 58 26z" fill="#ffffff"/>
      <path d="M58 26c3.5 16.8 11.7 25 28.5 28.5-16.8 3.5-25 11.7-28.5 28.5-3.5-16.8-11.7-25-28.5-28.5C46.3 51 54.5 42.8 58 26z" fill="#dbe3ff" opacity=".5" transform="translate(-1.6 -1.6)"/>
    </g>

    <text x="308" y="226" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="112" font-weight="800" letter-spacing="-2.8" fill="url(#ink)">Lozyk<tspan font-weight="300" fill="#98a7cc"> / Hex_a</tspan></text>

    <text x="313" y="300" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="400" letter-spacing=".6" fill="#a6b6d9">Developer · curious mind · building ideas into reality</text>

    <rect x="313" y="344" width="660" height="1" fill="url(#hair)"/>

    <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="3.6">
      <g transform="translate(313 390)">
        <rect width="134" height="56" rx="28" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".2"/>
        <text x="67" y="36" text-anchor="middle" fill="#cbd6f7">LUA</text>
      </g>
      <g transform="translate(463 390)">
        <rect width="172" height="56" rx="28" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".2"/>
        <text x="86" y="36" text-anchor="middle" fill="#cbd6f7">PYTHON</text>
      </g>
      <g transform="translate(651 390)">
        <rect width="142" height="56" rx="28" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".2"/>
        <text x="71" y="36" text-anchor="middle" fill="#cbd6f7">JAVA</text>
      </g>
      <g transform="translate(809 390)">
        <rect width="210" height="56" rx="28" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".2"/>
        <text x="105" y="36" text-anchor="middle" fill="#cbd6f7">HTML / CSS</text>
      </g>
    </g>

    <text x="313" y="520" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="20" letter-spacing="1.8" fill="#8496bb">github.com/Oracle228</text>

    <rect width="2400" height="620" fill="url(#vig)"/>
  </g>

  <rect x="4.5" y="4.5" width="2391" height="611" rx="33.5" fill="none" stroke="url(#edge)" stroke-width="1.6"/>
</svg>
